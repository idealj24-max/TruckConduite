<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>TruckConduite 3D - Simulateur Poids Lourd Ultra-Réaliste</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background: #090d16; touch-action: none; }
        
        #hud-top {
            position: absolute; top: 8px; left: 8px; right: 8px;
            display: flex; justify-content: space-between; gap: 8px; pointer-events: none; z-index: 5;
        }
        .panel {
            background: rgba(10, 15, 28, 0.86); color: #f8fafc;
            padding: 8px 12px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            pointer-events: auto; backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        h1 { margin: 0 0 4px 0; font-size: 14px; color: #f59e0b; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .stat-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; margin: 2px 0; }
        .val { font-weight: bold; color: #38bdf8; }
        
        #rpm-bar-bg { width: 100%; height: 5px; background: #1e293b; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        #rpm-bar { width: 20%; height: 100%; background: #10b981; transition: width 0.05s, background 0.1s; }

        .btn-grid { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
        .btn-sm {
            background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
            padding: 5px 7px; border-radius: 6px; font-size: 11px; font-weight: bold;
            cursor: pointer;
        }
        .btn-sm.active { background: #f59e0b; color: #000; border-color: #f59e0b; }

        #warning-banner {
            position: absolute; top: 145px; left: 50%; transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.94); color: white; padding: 7px 16px;
            border-radius: 8px; font-weight: bold; font-size: 13px; display: none; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 15; border: 1px solid #fca5a5;
        }
        
        #modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.97); color: white; padding: 24px;
            border-radius: 14px; border: 2px solid #10b981; text-align: center;
            display: none; z-index: 30; width: 88%; max-width: 360px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        #modal button {
            margin-top: 15px; padding: 11px 22px; border: none; border-radius: 8px;
            background: #10b981; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;
        }

        /* Commandes Tactiles */
        #touch-controls {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 5;
        }
        .control-group { display: flex; gap: 8px; pointer-events: auto; align-items: flex-end; }
        .t-btn {
            background: rgba(15, 23, 42, 0.82); color: white; border: 2px solid rgba(255,255,255,0.22);
            border-radius: 12px; font-weight: bold; font-size: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .t-btn:active, .t-btn.pressed { background: rgba(245, 158, 11, 0.92); color: #000; border-color: #fff; }
        .steer-btn { width: 64px; height: 64px; font-size: 22px; }
        .horn-btn { width: 46px; height: 46px; font-size: 18px; border-color: #f59e0b; }
        .pedal-btn { width: 54px; height: 80px; font-size: 11px; }
        .pedal-clutch { height: 66px; border-color: #38bdf8; }
        .pedal-brake { height: 74px; border-color: #ef4444; }
        .pedal-gas { height: 88px; border-color: #10b981; }
        
        .gear-shifter { display: flex; flex-direction: column; gap: 5px; }
        .gear-btn { width: 44px; height: 40px; font-size: 16px; }
    </style>
</head>
<body>

    <div id="hud-top">
        <div class="panel" style="min-width: 175px;">
            <h1>🚛 TruckConduite</h1>
            <div class="stat-row"><span>Mode :</span> <span class="val" id="vehicle-mode">PELLETEUSE</span></div>
            <div class="stat-row"><span>Vitesse :</span> <span class="val" id="speed">0 km/h</span></div>
            <div class="stat-row"><span>Rapport :</span> <span class="val" id="gear-display">N</span></div>
            <div class="stat-row"><span>Régime :</span> <span class="val" id="rpm-val">800 tr/m</span></div>
            <div id="rpm-bar-bg"><div id="rpm-bar"></div></div>
            <div class="btn-grid">
                <button class="btn-sm active" id="btn-trans" onclick="toggleTransmission()">MANU</button>
                <button class="btn-sm active" id="btn-cam" onclick="cycleCamera()">EXTERNE</button>
                <button class="btn-sm" onclick="toggleRamps()">Rampes</button>
                <button class="btn-sm" id="btn-sound" onclick="toggleAudio()">🔊 Son</button>
            </div>
        </div>

        <div class="panel" style="max-width: 215px; border-left: 4px solid #f59e0b;">
            <strong style="color:#f59e0b; font-size: 12px;">🎯 MISSION EN COURS</strong>
            <p id="mission-text" style="font-size: 11.5px; margin: 4px 0; line-height: 1.35; color: #e2e8f0;">
                1. Baissez les rampes et montez la pelleteuse sur le porte-char.
            </p>
            <div class="stat-row"><span>Attelage :</span> <span class="val" id="angle">0°</span></div>
            <div class="stat-row"><span>Distance :</span> <span class="val" id="dist-goal">295 m</span></div>
            <button class="btn-sm" onclick="resetGame()" style="width:100%; margin-top:4px;">Recommencer (R)</button>
        </div>
    </div>

    <div id="warning-banner">⚠️ ALERTE</div>

    <div id="modal">
        <h2 style="color:#10b981; margin:0 0 10px 0;">🎉 Livraison Réussie !</h2>
        <p id="modal-desc" style="font-size:14px; color:#cbd5e1; line-height: 1.4;"></p>
        <button onclick="resetGame()">Nouvelle Mission</button>
    </div>

    <div id="touch-controls">
        <div class="control-group">
            <div class="t-btn steer-btn" id="btn-left">◀</div>
            <div class="t-btn steer-btn" id="btn-right">▶</div>
            <div class="t-btn horn-btn" id="btn-horn" onmousedown="playHorn()" ontouchstart="playHorn()">📯</div>
        </div>

        <div class="control-group">
            <div class="gear-shifter" id="manual-shifter">
                <div class="t-btn gear-btn" onclick="shiftGear(1)">+</div>
                <div class="t-btn gear-btn" onclick="shiftGear(-1)">-</div>
            </div>
            <div class="t-btn pedal-btn pedal-clutch" id="btn-clutch">EMB<br><small>(E)</small></div>
            <div class="t-btn pedal-btn pedal-brake" id="btn-brake">FREIN<br><small>(S)</small></div>
            <div class="t-btn pedal-btn pedal-gas" id="btn-gas">GAZ<br><small>(Z)</small></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- SYNTHÉTISEUR AUDIO DIESEL & KLAXON (HORS-LIGNE) ---
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let soundEnabled = false;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.value = 38;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 140;

            engineGain = audioCtx.createGain();
            engineGain.gain.value = 0.08;

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
            soundEnabled = true;
            document.getElementById('btn-sound').classList.add('active');
        }

        function toggleAudio() {
            if (!audioCtx) {
                initAudio();
                return;
            }
            soundEnabled = !soundEnabled;
            engineGain.gain.value = soundEnabled ? 0.08 : 0;
            document.getElementById('btn-sound').classList.toggle('active', soundEnabled);
        }

        function playHorn() {
            if (!audioCtx) initAudio();
            if (!soundEnabled) return;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.type = 'sawtooth';
            osc2.type = 'sawtooth';
            osc1.frequency.value = 185; // Trompe grave poids lourd
            osc2.frequency.value = 233;
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.65);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.65);
            osc2.stop(audioCtx.currentTime + 0.65);
        }

        // --- TEXTURES PROCÉDURALES RÉALISTES ---
        function createAsphaltTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e242b';
            ctx.fillRect(0, 0, 512, 512);
            // Grain de bitume
            for (let i = 0; i < 18000; i++) {
                const v = 22 + Math.floor(Math.random() * 25);
                ctx.fillStyle = `rgb(${v},${v+3},${v+7})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }
            // Bandes blanches latérales
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(18, 0, 10, 512);
            ctx.fillRect(484, 0, 10, 512);
            // Ligne centrale discontinue
            ctx.fillStyle = '#facc15';
            ctx.fillRect(252, 40, 8, 180);
            ctx.fillRect(252, 300, 8, 180);

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.anisotropy = 8;
            return tex;
        }

        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 0, 256, 512);
            // Fenêtres d'immeuble
            for (let y = 16; y < 490; y += 32) {
                for (let x = 16; x < 230; x += 32) {
                    const lit = Math.random() > 0.35;
                    ctx.fillStyle = lit ? '#bae6fd' : '#0f172a';
                    ctx.fillRect(x, y, 20, 20);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createGaugeTexture(maxLabel, unit) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#090d16';
            ctx.beginPath(); ctx.arc(128, 128, 124, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(128, 128, 118, 0.75 * Math.PI, 2.25 * Math.PI); ctx.stroke();

            ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(unit, 128, 185);
            ctx.font = '18px sans-serif';
            ctx.fillText('0', 60, 195);
            ctx.fillText(maxLabel, 196, 195);
            return new THREE.CanvasTexture(canvas);
        }

        // --- SCÈNE 3D & ÉCLAIRAGE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x60a5fa);
        scene.fog = new THREE.FogExp2(0x60a5fa, 0.0032);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 700);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const sun = new THREE.DirectionalLight(0xfffbeb, 0.95);
        sun.position.set(120, 180, 90);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        const d = 160;
        sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
        sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
        scene.add(sun);

        // --- ENVIRONNEMENT SANS Z-FIGHTING ---
        // Sol désertique / terrain naturel (y = 0)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(1000, 1000),
            new THREE.MeshStandardMaterial({ color: 0xc2b280, roughness: 0.95 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0.0;
        ground.receiveShadow = true;
        scene.add(ground);

        // Route asphaltée principale Nord-Sud (y = 0.05)
        const roadTexNS = createAsphaltTexture();
        roadTexNS.repeat.set(1, 35);
        const roadNS = new THREE.Mesh(
            new THREE.PlaneGeometry(18, 700),
            new THREE.MeshStandardMaterial({ map: roadTexNS, roughness: 0.85 })
        );
        roadNS.rotation.x = -Math.PI / 2;
        roadNS.position.set(14, 0.05, 0);
        roadNS.receiveShadow = true;
        scene.add(roadNS);

        // Avenue Est-Ouest Centre-Ville (y = 0.04)
        const roadTexEW = createAsphaltTexture();
        roadTexEW.repeat.set(1, 25);
        const roadEW = new THREE.Mesh(
            new THREE.PlaneGeometry(16, 500),
            new THREE.MeshStandardMaterial({ map: roadTexEW, roughness: 0.85 })
        );
        roadEW.rotation.x = -Math.PI / 2;
        roadEW.rotation.z = Math.PI / 2;
        roadEW.position.set(14, 0.04, 110);
        roadEW.receiveShadow = true;
        scene.add(roadEW);

        // Trottoirs urbains le long de l'avenue principale
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.9 });
        const swLeft = new THREE.Mesh(new THREE.BoxGeometry(3, 0.22, 680), sidewalkMat);
        swLeft.position.set(3.5, 0.11, 0);
        swLeft.receiveShadow = true;
        const swRight = new THREE.Mesh(new THREE.BoxGeometry(3, 0.22, 680), sidewalkMat);
        swRight.position.set(24.5, 0.11, 0);
        swRight.receiveShadow = true;
        scene.add(swLeft, swRight);

        // Aire industrielle de départ (à gauche de la route, sans chevauchement, y = 0.05)
        const yard = new THREE.Mesh(
            new THREE.PlaneGeometry(18, 65),
            new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 })
        );
        yard.rotation.x = -Math.PI / 2;
        yard.position.set(-8, 0.05, -55);
        yard.receiveShadow = true;
        scene.add(yard);

        // Zone de livraison finale au Nord (y = 0.06)
        const deliveryZone = new THREE.Mesh(
            new THREE.PlaneGeometry(7, 24),
            new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.55 })
        );
        deliveryZone.rotation.x = -Math.PI / 2;
        deliveryZone.position.set(-8, 0.06, 220);
        scene.add(deliveryZone);

        // Bordures lumineuses de la zone de livraison
        const borderMat = new THREE.MeshBasicMaterial({ color: 0x34d399 });
        const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.4, 24), borderMat); b1.position.set(-11.5, 0.2, 220);
        const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.4, 24), borderMat); b2.position.set(-4.5, 0.2, 220);
        scene.add(b1, b2);

        // --- IMMEUBLES DE VILLE & LAMPADAIRES ---
        const bldgTex = createBuildingTexture();
        const bldgMat = new THREE.MeshStandardMaterial({ map: bldgTex, roughness: 0.4 });
        const obstacles = [];

        function addBuilding(x, z, w, d, h) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldgMat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            obstacles.push({ x, z, hw: w / 2 + 1.5, hd: d / 2 + 1.5 });
        }

        // Gratte-ciels et bâtiments de la ville
        addBuilding(45, -20, 28, 28, 32);
        addBuilding(45, 45, 30, 35, 48);
        addBuilding(45, 165, 32, 30, 55);
        addBuilding(45, 220, 28, 30, 38);
        addBuilding(-32, 35, 26, 30, 42);
        addBuilding(-32, 165, 28, 32, 46);

        // Lampadaires urbains
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.7 });
        const lampBulbMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
        for (let z = -120; z <= 240; z += 45) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 7.5, 8), poleMat);
            pole.position.set(24.2, 3.75, z);
            const arm = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.12), poleMat);
            arm.position.set(23.2, 7.4, z);
            const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.25), lampBulbMat);
            bulb.position.set(22.4, 7.32, z);
            scene.add(pole, arm, bulb);
        }

        // --- MATÉRIAUX VÉHICULES HAUTE QUALITÉ ---
        const matChassis = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6, metalness: 0.4 });
        const matCab = new THREE.MeshStandardMaterial({ color: 0xea580c, roughness: 0.25, metalness: 0.35 });
        const matChrome = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.15, metalness: 0.9 });
        const matGlass = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.22 });
        const matDash = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.75 });
        const matTrailer = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6, metalness: 0.3 });
        const matRamp = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });
        const matCat = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.35 });
        const matTire = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 });

        function makeWheel(x, y, z, r = 0.55) {
            const group = new THREE.Group();
            const tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.42, 20), matTire);
            tire.rotation.z = Math.PI / 2;
            tire.castShadow = true;
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r * 0.55, 0.44, 16), matChrome);
            rim.rotation.z = Math.PI / 2;
            group.add(tire, rim);
            group.position.set(x, y, z);
            return group;
        }

        // --- TRACTEUR POIDS LOURD & CABINE INTÉRIEURE ---
        const tractor = new THREE.Group();
        scene.add(tractor);

        const tChassis = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.55, 6.4), matChassis);
        tChassis.position.y = 0.88;
        tChassis.castShadow = true;
        tractor.add(tChassis);

        // Réservoirs de carburant chromés latéraux
        const tankL = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.8, 16), matChrome);
        tankL.rotation.x = Math.PI / 2; tankL.position.set(-1.15, 0.85, -0.1);
        const tankR = tankL.clone(); tankR.position.x = 1.15;
        tractor.add(tankL, tankR);

        // Cabine
        const cabGroup = new THREE.Group();
        cabGroup.position.set(0, 1.15, 1.85);
        tractor.add(cabGroup);

        const cabFloor = new THREE.Mesh(new THREE.BoxGeometry(2.48, 0.18, 2.35), matDash);
        const cabRoof = new THREE.Mesh(new THREE.BoxGeometry(2.48, 0.22, 2.35), matCab);
        cabRoof.position.y = 2.45;
        const cabBack = new THREE.Mesh(new THREE.BoxGeometry(2.48, 2.45, 0.15), matCab);
        cabBack.position.set(0, 1.22, -1.1);
        const cabFrontLower = new THREE.Mesh(new THREE.BoxGeometry(2.48, 1.05, 0.22), matCab);
        cabFrontLower.position.set(0, 0.52, 1.1);

        // Calandre chromée & Phares LED avant
        const grille = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.7, 0.08), matChrome);
        grille.position.set(0, 0.45, 1.22);
        const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.18, 0.08), headlightMat);
        hlL.position.set(-0.98, 0.32, 1.22);
        const hlR = hlL.clone(); hlR.position.x = 0.98;
        cabGroup.add(grille, hlL, hlR);

        // Gyrophares orange sur le toit (Convoi Exceptionnel)
        const beaconMat = new THREE.MeshBasicMaterial({ color: 0xff9800 });
        const beaconL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.18, 12), beaconMat);
        beaconL.position.set(-0.85, 2.64, 0.6);
        const beaconR = beaconL.clone(); beaconR.position.x = 0.85;
        cabGroup.add(beaconL, beaconR);

        // Montants pare-brise fins
        const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 0.1), matCab);
        pillarL.position.set(-1.18, 1.75, 1.1);
        const pillarR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 0.1), matCab);
        pillarR.position.set(1.18, 1.75, 1.1);

        const doorL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.05, 2.2), matCab);
        doorL.position.set(-1.2, 0.52, 0);
        const doorR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.05, 2.2), matCab);
        doorR.position.set(1.2, 0.52, 0);

        const windshield = new THREE.Mesh(new THREE.PlaneGeometry(2.25, 1.35), matGlass);
        windshield.position.set(0, 1.75, 1.1);
        windshield.rotation.y = Math.PI;

        cabGroup.add(cabFloor, cabRoof, cabBack, cabFrontLower, pillarL, pillarR, doorL, doorR, windshield);

        // --- INTÉRIEUR COCKPIT : TABLEAU DE BORD, VOLANT, COMPTEURS, LEVIER ---
        const interior = new THREE.Group();
        cabGroup.add(interior);

        const dashboard = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.55, 0.6), matDash);
        dashboard.position.set(0, 0.95, 0.8);
        interior.add(dashboard);

        // Combiné d'instruments avec textures graduées
        const clusterBox = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.28, 0.12), matChassis);
        clusterBox.position.set(-0.55, 1.24, 0.62);
        clusterBox.rotation.x = -0.3;
        interior.add(clusterBox);

        // --- ÉTAT DU SIMULATEUR ---
        let sim = {

        const gearRatios = { '-1': -3.8, '0': 0, '1': 4.2, '2': 2.8, '3': 2.0, '4': 1.45, '5': 1.1, '6': 0.85 };
        const input = { left: false, right: false, gas: false, brake: false, clutch: false };

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            if (!el) return;
            const press = (e) => { e.preventDefault(); input[key] = true; el.classList.add('pressed'); };
            const release = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('pressed'); };
            el.addEventListener('touchstart', press, {passive: false});
            el.addEventListener('touchend', release);
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        }
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-gas', 'gas');
        bindTouch('btn-brake', 'brake');
        bindTouch('btn-clutch', 'clutch');

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
            if (e.code === 'KeyW' || e.code === 'ArrowUp') input.gas = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') input.brake = true;
            if (e.code === 'KeyE') input.clutch = true;
            if (e.code === 'KeyQ' || e.code === 'ShiftLeft') shiftGear(1);
            if (e.code === 'KeyF' || e.code === 'ControlLeft') shiftGear(-1);
            if (e.code === 'KeyB') toggleRamps();
            if (e.code === 'KeyC') cycleCamera();
            if (e.code === 'KeyH') playHorn();
            if (e.code === 'KeyR') resetGame();
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
            if (e.code === 'KeyW' || e.code === 'ArrowUp') input.gas = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') input.brake = false;
            if (e.code === 'KeyE') input.clutch = false;
        });

        function toggleTransmission() {
            sim.isManual = !sim.isManual;
            const btn = document.getElementById('btn-trans');
            btn.innerText = sim.isManual ? "MANU" : "AUTO";
            btn.classList.toggle('active', sim.isManual);
            document.getElementById('manual-shifter').style.display = sim.isManual ? 'flex' : 'none';
            document.getElementById('btn-clutch').style.display = sim.isManual ? 'flex' : 'none';
            sim.stalled = false;
        }

        function shiftGear(dir) {
            if (!sim.isManual || sim.phase !== 'DRIVING') return;
            if (!input.clutch) {
                showWarning("Appuyez sur EMBRAYAGE (EMB) pour changer de rapport !");
                return;
            }
            sim.gear = Math.max(-1, Math.min(6, sim.gear + dir));
            if (sim.stalled && sim.gear === 0) sim.stalled = false;
        }

        function toggleRamps() {
            if (Math.abs(sim.speed) > 0.2) {
                showWarning("Arrêtez le camion avant d'actionner les rampes !");

        let warnTimeout;
        function showWarning(msg) {
            const el = document.getElementById('warning-banner');

            warnTimeout = setTimeout(() => el.style.display = 'none', 2500);
        }

        function resetGame() {
            sim.phase = 'LOADING';
            sim.rampsDown = false;
            sim.rampAngle = -1.35;
            sim.exX = -8; sim.exZ = -74; sim.exY = 0; sim.exAngle = 0; sim.exSpeed = 0;
            sim.x = -8; sim.z = -52; sim.tractorAngle = 0; sim.trailerAngle = 0;
            sim.speed = 0; sim.steerAngle = 0; sim.gear = 0; sim.rpm = 800; sim.stalled = false;
            sim.camMode = 0;
            document.getElementById('btn-cam').innerText = "EXTERNE";
            document.getElementById('modal').style.display = 'none';
            document.getElementById('vehicle-mode').innerText = "PELLETEUSE";
            document.getElementById('mission-text').innerText = "1. Baissez les rampes et montez la pelleteuse sur le porte-char.";
        }

        const wheelBase = 4.2;
        const hitchOffset = -1.5;
        const trailerLength = 9.8;

        function update(dt) {
            sim.time += dt;
            // Clignotement des gyrophares orange
            const flash = Math.sin(sim.time * 12) > 0;
            beaconMat.color.setHex(flash ? 0xff9800 : 0x7c2d12);

            // Mise à jour son moteur
            if (soundEnabled && engineOsc) {
                const freq = sim.phase === 'LOADING' ? (42 + Math.abs(sim.exSpeed) * 8) : (34 + (sim.rpm / 2800) * 55);
                engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
            }

            const targetRamp = sim.rampsDown ? 0.28 : -1.35;
            sim.rampAngle += (targetRamp - sim.rampAngle) * 6 * dt;
            rampPivot.rotation.x = sim.rampAngle;

            if (sim.phase === 'LOADING') {
                if (input.gas) sim.exSpeed = 3.2;
                else if (input.brake) sim.exSpeed = -2.5;
                else sim.exSpeed *= 0.8;

                if (input.left) sim.exAngle += 1.3 * dt;
                if (input.right) sim.exAngle -= 1.3 * dt;

                sim.exX += Math.sin(sim.exAngle) * sim.exSpeed * dt;
                sim.exZ += Math.cos(sim.exAngle) * sim.exSpeed * dt;

                const hitchZ = sim.z + hitchOffset;
                const rampStartZ = hitchZ - 14.8;
                const bedStartZ = hitchZ - 12.2;
                const bedEndZ = hitchZ - 4.0;

                if (Math.abs(sim.exX - sim.x) < 1.35 && sim.exZ > rampStartZ && sim.exZ < bedEndZ) {
                    if (!sim.rampsDown && sim.exZ < bedStartZ) {
                        sim.exZ = rampStartZ;
                        showWarning("Appuyez sur RAMPES pour abaisser les rampes !");
                    } else if (sim.exZ <= bedStartZ) {
                        const progress = (sim.exZ - rampStartZ) / (bedStartZ - rampStartZ);
                        sim.exY = Math.max(0, progress * 0.9);
                    } else {
                        sim.exY = 0.9;
                    }
                } else {
                    sim.exY = 0;
                }

                excavator.position.set(sim.exX, sim.exY, sim.exZ);
                excavator.rotation.y = sim.exAngle;

                document.getElementById('speed').innerText = `${Math.abs(Math.round(sim.exSpeed * 3.6))} km/h`;
                document.getElementById('gear-display').innerText = "CHENILLES";

                if (sim.exY >= 0.88 && sim.exZ > hitchZ - 9.5 && sim.exZ < hitchZ - 5.5 && Math.abs(sim.exSpeed) < 0.2) {
                    sim.phase = 'DRIVING';
                    sim.rampsDown = false;
                    sim.camMode = 1; // Passe automatiquement en vue cabine
                    document.getElementById('btn-cam').innerText = "CABINE";
                    document.getElementById('vehicle-mode').innerText = "PORTE-CHAR";
                    document.getElementById('mission-text').innerText = "2. Rejoignez l'avenue à droite et livrez au chantier vert au Nord !";
                    showWarning("Engin arrimé ! Vous êtes aux commandes du poids lourd.");
                }
            } else {
                const maxSteer = 0.52;
                if (input.left) sim.steerAngle = Math.min(maxSteer, sim.steerAngle + 1.4 * dt);
                else if (input.right) sim.steerAngle = Math.max(-maxSteer, sim.steerAngle - 1.4 * dt);
                else if (Math.abs(sim.speed) > 0.2) sim.steerAngle *= 0.92;

                if (!sim.isManual) {
                    if (input.gas) {
                        if (sim.speed < -0.2) sim.speed += 16 * dt;
                        else {
                            sim.speed = Math.min(20, sim.speed + 7.5 * dt);
                            sim.gear = Math.min(6, Math.max(1, Math.ceil(sim.speed / 3.3)));
                        }
                    } else if (input.brake) {
                        if (sim.speed > 0.2) sim.speed -= 18 * dt;
                        else {
                            sim.speed = Math.max(-6, sim.speed - 5 * dt);
                            sim.gear = -1;
                        }
                    } else {
                        sim.speed *= 0.97;
                        if (Math.abs(sim.speed) < 0.05) { sim.speed = 0; sim.gear = 0; }
                    }
                    sim.rpm = 800 + (Math.abs(sim.speed) % 3.4) * 540;
                } else {
                    if (sim.stalled) {
                        sim.rpm = 0;
                        sim.speed *= 0.92;
                        showWarning("MOTEUR CALÉ ! Passez au Point Mort (N) avec embrayage.");
                    } else if (sim.gear === 0 || input.clutch) {
                        const targetRpm = input.gas ? 2600 : 800;
                        sim.rpm += (targetRpm - sim.rpm) * 6 * dt;
                        sim.speed *= 0.985;
                    } else {
                        const ratio = gearRatios[sim.gear];
                        const wheelRpm = Math.abs(sim.speed) * Math.abs(ratio) * 110;
                        sim.rpm = Math.max(600, wheelRpm);

                        if (sim.rpm < 720 && Math.abs(sim.gear) > 1 && !input.gas) {
                            sim.stalled = true;
                        }

                        if (input.gas && sim.rpm < 2800) {
                            const dir = sim.gear > 0 ? 1 : -1;
                            const torque = (11.5 / Math.abs(ratio)) * 1.6;
                            sim.speed += dir * torque * dt;
                        }
                    }

                    if (input.brake) {
                        sim.speed *= 0.90;
                        if (Math.abs(sim.speed) < 0.1) sim.speed = 0;
                    } else {
                        sim.speed *= 0.992;
                    }
                }

                // Calcul prochaine position et détection collisions immeubles
                if (Math.abs(sim.speed) > 0.02) {
                    const angularVel = (sim.speed / wheelBase) * Math.tan(sim.steerAngle);
                    const nextAngle = sim.tractorAngle + angularVel * dt;
                    const nextX = sim.x + Math.sin(nextAngle) * sim.speed * dt;
                    const nextZ = sim.z + Math.cos(nextAngle) * sim.speed * dt;

                    let hit = false;
                    for (const obs of obstacles) {
                        if (Math.abs(nextX - obs.x) < obs.hw && Math.abs(nextZ - obs.z) < obs.hd) {
                            hit = true;
                            break;
                        }
                    }

                    if (!hit) {
                        sim.tractorAngle = nextAngle;
                        sim.x = nextX;
                        sim.z = nextZ;
                    } else {
                        sim.speed = -sim.speed * 0.25;
                        showWarning("Impact ! Attention aux bâtiments.");
                    }
                }

                const hitchX = sim.x + Math.sin(sim.tractorAngle) * hitchOffset;
                const hitchZ = sim.z + Math.cos(sim.tractorAngle) * hitchOffset;
                const diffAngle = sim.tractorAngle - sim.trailerAngle;
                sim.trailerAngle += ((sim.speed / trailerLength) * Math.sin(diffAngle)) * dt;

                const cargoX = hitchX - Math.sin(sim.trailerAngle) * 7.2;
                const cargoZ = hitchZ - Math.cos(sim.trailerAngle) * 7.2;
                excavator.position.set(cargoX, 0.9, cargoZ);
                excavator.rotation.y = sim.trailerAngle;

                // Animation Volant, Levier de vitesses et Aiguilles calibrées
                steeringWheelGroup.rotation.z = -sim.steerAngle * 4.5;
                
                const gearPositions = {
                    '-1': { x: -0.25, z: 0.25 }, '0': { x: 0, z: 0 },
                    '1': { x: -0.25, z: -0.25 }, '2': { x: -0.25, z: 0.25 },
                    '3': { x: 0, z: -0.25 }, '4': { x: 0, z: 0.25 },
                    '5': { x: 0.25, z: -0.25 }, '6': { x: 0.25, z: 0.25 }
                };
                const gp = gearPositions[sim.gear] || { x: 0, z: 0 };
                gearStickPivot.rotation.z += (gp.x - gearStickPivot.rotation.z) * 10 * dt;
                gearStickPivot.rotation.x += (gp.z - gearStickPivot.rotation.x) * 10 * dt;

                const speedRatio = Math.min(1, Math.abs(sim.speed) / 22);
                const rpmRatio = Math.min(1, sim.rpm / 3000);
                speedNeedle.rotation.z = 2.1 - speedRatio * 4.2;
                rpmNeedle.rotation.z = 2.1 - rpmRatio * 4.2;

                // Télémétrie HUD
                document.getElementById('speed').innerText = `${Math.abs(Math.round(sim.speed * 3.6))} km/h`;
                document.getElementById('gear-display').innerText = sim.gear === 0 ? 'N' : (sim.gear === -1 ? 'R' : 'D' + sim.gear);
                document.getElementById('rpm-val').innerText = `${Math.round(sim.rpm)} tr/m`;
                
                const rpmPct = Math.min(100, (sim.rpm / 2800) * 100);
                const rpmBar = document.getElementById('rpm-bar');
                rpmBar.style.width = rpmPct + '%';
                rpmBar.style.background = sim.rpm > 2300 ? '#ef4444' : '#10b981';

                const jackknife = Math.round(Math.atan2(Math.sin(diffAngle), Math.cos(diffAngle)) * 180 / Math.PI);
                document.getElementById('angle').innerText = `${jackknife}°`;
                if (Math.abs(jackknife) > 65) showWarning("ATTENTION MISE EN PORTEFEUILLE !");

                const distGoal = Math.round(Math.hypot(cargoX - (-8), cargoZ - 220));
                document.getElementById('dist-goal').innerText = `${distGoal} m`;

                if (distGoal < 4.0 && Math.abs(sim.speed) < 0.15) {
                    document.getElementById('modal-desc').innerText = "Convoi exceptionnel livré avec précision au chantier Nord !";
                    document.getElementById('modal').style.display = 'block';
                }
            }

            tractor.position.set(sim.x, 0, sim.z);
            tractor.rotation.y = sim.tractorAngle;
            wheelFL.rotation.y = sim.steerAngle;
            wheelFR.rotation.y = sim.steerAngle;

            const hX = sim.x + Math.sin(sim.tractorAngle) * hitchOffset;
            const hZ = sim.z + Math.cos(sim.tractorAngle) * hitchOffset;
            trailer.position.set(hX, 0, hZ);
            trailer.rotation.y = sim.trailerAngle;

            // Trafic urbain intelligent
            trafficCars.forEach(car => {
                const distToTruck = Math.hypot(car.mesh.position.x - sim.x, car.mesh.position.z - sim.z);
                const blocked = distToTruck < 19;
                const targetSpd = blocked ? 0 : car.baseSpeed;
                car.speed += (targetSpd - car.speed) * 5 * dt;

                if (car.dir === 'N') { car.mesh.position.z += car.speed * dt; if (car.mesh.position.z > 320) car.mesh.position.z = -320; }
                if (car.dir === 'S') { car.mesh.position.z -= car.speed * dt; if (car.mesh.position.z < -320) car.mesh.position.z = 320; }
                if (car.dir === 'E') { car.mesh.position.x += car.speed * dt; if (car.mesh.position.x > 240) car.mesh.position.x = -240; }
                if (car.dir === 'W') { car.mesh.position.x -= car.speed * dt; if (car.mesh.position.x < -240) car.mesh.position.x = 240; }
            });
        }

        // --- RENDU DES RÉTROVISEURS ---
        function updateMirrors() {
            if (sim.camMode !== 1 || sim.phase !== 'DRIVING') return;

            const sinA = Math.sin(sim.tractorAngle);
            const cosA = Math.cos(sim.tractorAngle);

            const mLX = sim.x - cosA * 1.45 + sinA * 2.5;
            const mLZ = sim.z + sinA * 1.45 + cosA * 2.5;
            mirrorCamL.position.set(mLX, 2.7, mLZ);
            mirrorCamL.lookAt(mLX - sinA * 25 + cosA * 0.6, 1.3, mLZ - cosA * 25 - sinA * 0.6);

            const mRX = sim.x + cosA * 1.45 + sinA * 2.5;
            const mRZ = sim.z - sinA * 1.45 + cosA * 2.5;
            mirrorCamR.position.set(mRX, 2.7, mRZ);
            mirrorCamR.lookAt(mRX - sinA * 25 - cosA * 0.6, 1.3, mRZ - cosA * 25 + sinA * 0.6);

            renderer.setRenderTarget(mirrorRenderTargetL);
            renderer.render(scene, mirrorCamL);

            renderer.setRenderTarget(mirrorRenderTargetR);
            renderer.render(scene, mirrorCamR);

            renderer.setRenderTarget(null);
        }

        // --- CAMÉRAS ---
        function updateCamera() {
            if (sim.phase === 'LOADING') {
                camera.position.lerp(new THREE.Vector3(sim.exX - 7, 5.5, sim.exZ - 8), 0.1);
                camera.lookAt(sim.exX, 1.2, sim.exZ + 3);
                return;
            }

            if (sim.camMode === 0) {
                const cx = sim.x - Math.sin(sim.tractorAngle) * 18;
                const cz = sim.z - Math.cos(sim.tractorAngle) * 18;
                camera.position.lerp(new THREE.Vector3(cx, 8.2, cz), 0.12);
                camera.lookAt(sim.x, 2, sim.z);
            } else if (sim.camMode === 1) {
                // Position siège conducteur recalibrée pour voir volant, compteurs, levier et rétros
                const sinA = Math.sin(sim.tractorAngle);
                const cosA = Math.cos(sim.tractorAngle);
                const driverX = sim.x - cosA * 0.48 + sinA * 1.55;
                const driverZ = sim.z + sinA * 0.48 + cosA * 1.55;
                camera.position.set(driverX, 2.88, driverZ);
                
                const lookX = driverX + sinA * 20;
                const lookZ = driverZ + cosA * 20;
                camera.lookAt(lookX, 2.15, lookZ);
            } else {
                camera.position.set(sim.x, 48, sim.z - 12);
                camera.lookAt(sim.x, 0, sim.z + 15);
            }
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            update(dt);
            updateMirrors();
            updateCamera();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log("Service Worker enregistré !"))
                    .catch((err) => console.log("Erreur SW :", err));
            });
        }
    </script>
</body>
