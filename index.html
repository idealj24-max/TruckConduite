<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>TruckConduite 3D - Simulateur Poids Lourd & Porte-Char</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background: #0f172a; touch-action: none; }
        
        #hud-top {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; gap: 10px; pointer-events: none;
        }
        .panel {
            background: rgba(15, 23, 42, 0.88); color: #f8fafc;
            padding: 10px 14px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: auto; backdrop-filter: blur(4px);
        }
        h1 { margin: 0 0 6px 0; font-size: 16px; color: #f59e0b; letter-spacing: 0.5px; }
        .stat-row { display: flex; justify-content: space-between; gap: 15px; font-size: 13px; margin: 3px 0; }
        .val { font-weight: bold; color: #38bdf8; }
        
        #rpm-bar-bg { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        #rpm-bar { width: 20%; height: 100%; background: #10b981; transition: width 0.05s, background 0.1s; }

        .btn-sm {
            background: #334155; color: #fff; border: 1px solid #475569;
            padding: 5px 8px; border-radius: 6px; font-size: 12px; font-weight: bold;
            cursor: pointer; margin-top: 5px;
        }
        .btn-sm.active { background: #f59e0b; color: #000; border-color: #f59e0b; }

        #warning-banner {
            position: absolute; top: 130px; left: 50%; transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.92); color: white; padding: 8px 18px;
            border-radius: 8px; font-weight: bold; font-size: 14px; display: none; text-align: center;
        }
        #modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.96); color: white; padding: 24px;
            border-radius: 14px; border: 2px solid #10b981; text-align: center;
            display: none; z-index: 20; width: 85%; max-width: 360px;
        }
        #modal button {
            margin-top: 15px; padding: 10px 20px; border: none; border-radius: 8px;
            background: #10b981; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;
        }

        #touch-controls {
            position: absolute; bottom: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
        }
        .control-group { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
        .t-btn {
            background: rgba(30, 41, 59, 0.85); color: white; border: 2px solid rgba(255,255,255,0.25);
            border-radius: 12px; font-weight: bold; font-size: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .t-btn:active, .t-btn.pressed { background: rgba(245, 158, 11, 0.85); color: #000; border-color: #fff; }
        .steer-btn { width: 65px; height: 65px; font-size: 24px; }
        .pedal-btn { width: 58px; height: 85px; font-size: 12px; }
        .pedal-clutch { height: 70px; border-color: #38bdf8; }
        .pedal-brake { height: 75px; border-color: #ef4444; }
        .pedal-gas { height: 90px; border-color: #10b981; }
        
        .gear-shifter { display: flex; flex-direction: column; gap: 6px; }
        .gear-btn { width: 48px; height: 42px; font-size: 16px; }
    </style>
</head>
<body>

    <div id="hud-top">
        <div class="panel" style="min-width: 175px;">
            <h1>🚛 TruckConduite</h1>
            <div class="stat-row"><span>Mode :</span> <span class="val" id="vehicle-mode">ENGIN (Pelleteuse)</span></div>
            <div class="stat-row"><span>Vitesse :</span> <span class="val" id="speed">0 km/h</span></div>
            <div class="stat-row"><span>Rapport :</span> <span class="val" id="gear-display">N</span></div>
            <div class="stat-row"><span>Régime :</span> <span class="val" id="rpm-val">800 tr/m</span></div>
            <div id="rpm-bar-bg"><div id="rpm-bar"></div></div>
            <div style="margin-top:6px; display:flex; gap:5px; flex-wrap:wrap;">
                <button class="btn-sm active" id="btn-trans" onclick="toggleTransmission()">Boîte: MANUELLE</button>
                <button class="btn-sm" onclick="cycleCamera()">Caméra (C)</button>
                <button class="btn-sm" onclick="toggleRamps()">Rampes (B)</button>
            </div>
        </div>

        <div class="panel" style="max-width: 240px; border-left: 4px solid #f59e0b;">
            <strong style="color:#f59e0b; font-size: 13px;">🎯 ÉTAPE EN COURS</strong>
            <p id="mission-text" style="font-size: 12px; margin: 5px 0; line-height: 1.35;">
                1. Abaissez les rampes (B) et montez la pelleteuse sur le porte-char.
            </p>
            <div class="stat-row"><span>Angle remorque :</span> <span class="val" id="angle">0°</span></div>
            <button class="btn-sm" onclick="resetGame()" style="width:100%; margin-top:4px;">Recommencer (R)</button>
        </div>
    </div>

    <div id="warning-banner">⚠️ ALERTE</div>

    <div id="modal">
        <h2 id="modal-title" style="color:#10b981; margin:0 0 10px 0;">Mission Accomplie !</h2>
        <p id="modal-desc" style="font-size:14px; color:#cbd5e1;"></p>
        <button onclick="resetGame()">Rejouer le parcours</button>
    </div>

    <div id="touch-controls">
        <div class="control-group">
            <div class="t-btn steer-btn" id="btn-left">◀</div>
            <div class="t-btn steer-btn" id="btn-right">▶</div>
        </div>

        <div class="control-group">
            <div class="gear-shifter" id="manual-shifter">
                <div class="t-btn gear-btn" onclick="shiftGear(1)">+</div>
                <div class="t-btn gear-btn" onclick="shiftGear(-1)">-</div>
            </div>
            <div class="t-btn pedal-btn pedal-clutch" id="btn-clutch">EMB<br><small>(E)</small></div>
            <div class="t-btn pedal-btn pedal-brake" id="btn-brake">FREIN<br><small>(S)</small></div>
            <div class="t-btn pedal-btn pedal-gas" id="btn-gas">GAZ<br><small>(Z)</small></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.Fog(0x7dd3fc, 50, 260);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const sun = new THREE.DirectionalLight(0xffffff, 0.85);
        sun.position.set(60, 100, 40);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500),
            new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(14, 450),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
        );
        road.rotation.x = -Math.PI / 2;
        road.position.set(14, 0.02, 0);
        road.receiveShadow = true;
        scene.add(road);

        for (let z = -200; z <= 200; z += 10) {
            const line = new THREE.Mesh(
                new THREE.PlaneGeometry(0.25, 4.5),
                new THREE.MeshBasicMaterial({ color: 0xfacc15 })
            );
            line.rotation.x = -Math.PI / 2;
            line.position.set(14, 0.03, z);
            scene.add(line);
        }

        const yard = new THREE.Mesh(
            new THREE.PlaneGeometry(18, 45),
            new THREE.MeshStandardMaterial({ color: 0x334155 })
        );
        yard.rotation.x = -Math.PI / 2;
        yard.position.set(-2, 0.02, -30);
        scene.add(yard);

        const deliveryZone = new THREE.Mesh(
            new THREE.PlaneGeometry(5, 19),
            new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.45 })
        );
        deliveryZone.rotation.x = -Math.PI / 2;
        deliveryZone.position.set(-2, 0.04, 85);
        scene.add(deliveryZone);

        const matChassis = new THREE.MeshStandardMaterial({ color: 0x0f172a });
        const matCab = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3 });
        const matGlass = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1 });
        const matTrailer = new THREE.MeshStandardMaterial({ color: 0x475569 });
        const matRamp = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
        const matCat = new THREE.MeshStandardMaterial({ color: 0xeab308 });
        const matTire = new THREE.MeshStandardMaterial({ color: 0x111827 });

        function makeWheel(x, y, z, r = 0.55) {
            const w = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.4, 16), matTire);
            w.rotation.z = Math.PI / 2;
            w.position.set(x, y, z);
            w.castShadow = true;
            return w;
        }

        const tractor = new THREE.Group();
        scene.add(tractor);

        const tChassis = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.6, 6.2), matChassis);
        tChassis.position.y = 0.9;
        tChassis.castShadow = true;
        tractor.add(tChassis);

        const cab = new THREE.Mesh(new THREE.BoxGeometry(2.45, 2.5, 2.3), matCab);
        cab.position.set(0, 2.35, 1.8);
        cab.castShadow = true;
        tractor.add(cab);

        const windshield = new THREE.Mesh(new THREE.BoxGeometry(2.25, 1.0, 0.1), matGlass);
        windshield.position.set(0, 2.7, 2.96);
        tractor.add(windshield);

        const wheelFL = makeWheel(-1.25, 0.55, 2.1);
        const wheelFR = makeWheel(1.25, 0.55, 2.1);
        tractor.add(wheelFL, wheelFR);
        tractor.add(makeWheel(-1.25, 0.55, -1.2), makeWheel(1.25, 0.55, -1.2));
        tractor.add(makeWheel(-1.25, 0.55, -2.4), makeWheel(1.25, 0.55, -2.4));

        const trailer = new THREE.Group();
        scene.add(trailer);

        const neck = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.4, 3.2), matCab);
        neck.position.set(0, 1.4, -1.4);
        trailer.add(neck);

        const bed = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.35, 9.8), matTrailer);
        bed.position.set(0, 0.72, -7.3);
        bed.castShadow = true;
        bed.receiveShadow = true;
        trailer.add(bed);

        [-9.4, -10.5, -11.6].forEach(z => {
            trailer.add(makeWheel(-1.38, 0.5, z, 0.5));
            trailer.add(makeWheel(1.38, 0.5, z, 0.5));
        });

        const rampPivot = new THREE.Group();
        rampPivot.position.set(0, 0.75, -12.2);
        trailer.add(rampPivot);

        const rampL = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.15, 2.6), matRamp);
        rampL.position.set(-0.85, 0, -1.3);
        const rampR = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.15, 2.6), matRamp);
        rampR.position.set(0.85, 0, -1.3);
        rampPivot.add(rampL, rampR);

        const excavator = new THREE.Group();
        scene.add(excavator);

        const tracks = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.55, 3.4), matChassis);
        tracks.position.y = 0.28;
        const exBody = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.1, 2.3), matCat);
        exBody.position.set(0, 1.05, -0.2);
        exBody.castShadow = true;
        const exCab = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.0, 1.0), matGlass);
        exCab.position.set(-0.4, 1.85, 0.3);
        const exArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 3.0), matCat);
        exArm.position.set(0.4, 1.6, 1.4);
        exArm.rotation.x = 0.35;
        excavator.add(tracks, exBody, exCab, exArm);

        const trafficCars = [];
        function createTrafficCar(laneX, startZ, dir, color) {
            const car = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.2, 4.4), new THREE.MeshStandardMaterial({ color }));
            body.position.y = 0.8;
            body.castShadow = true;
            const roof = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.2), matGlass);
            roof.position.set(0, 1.65, -0.2);
            car.add(body, roof);
            car.position.set(laneX, 0, startZ);
            car.rotation.y = dir > 0 ? 0 : Math.PI;
            scene.add(car);
            trafficCars.push({ mesh: car, laneX, dir, baseSpeed: 9 + Math.random() * 4, speed: 10 });
        }

        createTrafficCar(17.5, -80, 1, 0xef4444);
        createTrafficCar(17.5, 20, 1, 0x3b82f6);
        createTrafficCar(10.5, 120, -1, 0xf8fafc);
        createTrafficCar(10.5, 10, -1, 0x10b981);

        let sim = {
            phase: 'LOADING',
            isManual: true,
            camMode: 0,
            rampsDown: false,
            rampAngle: -1.35,
            exX: -2, exZ: -48, exY: 0, exAngle: 0, exSpeed: 0,
            x: -2, z: -26,
            tractorAngle: 0,
            trailerAngle: 0,
            speed: 0,
            steerAngle: 0,
            gear: 0,
            rpm: 800,
            stalled: false
        };

        const gearRatios = { '-1': -3.8, '0': 0, '1': 4.2, '2': 2.8, '3': 2.0, '4': 1.45, '5': 1.1, '6': 0.85 };

        const input = { left: false, right: false, gas: false, brake: false, clutch: false };

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            if (!el) return;
            const press = (e) => { e.preventDefault(); input[key] = true; el.classList.add('pressed'); };
            const release = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('pressed'); };
            el.addEventListener('touchstart', press, {passive: false});
            el.addEventListener('touchend', release);
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        }
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-gas', 'gas');
        bindTouch('btn-brake', 'brake');
        bindTouch('btn-clutch', 'clutch');

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
            if (e.code === 'KeyW' || e.code === 'ArrowUp') input.gas = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') input.brake = true;
            if (e.code === 'KeyE') input.clutch = true;
            if (e.code === 'KeyQ' || e.code === 'ShiftLeft') shiftGear(1);
            if (e.code === 'KeyF' || e.code === 'ControlLeft') shiftGear(-1);
            if (e.code === 'KeyB') toggleRamps();
            if (e.code === 'KeyC') cycleCamera();
            if (e.code === 'KeyR') resetGame();
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
            if (e.code === 'KeyW' || e.code === 'ArrowUp') input.gas = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') input.brake = false;
            if (e.code === 'KeyE') input.clutch = false;
        });

        function toggleTransmission() {
            sim.isManual = !sim.isManual;
            const btn = document.getElementById('btn-trans');
            btn.innerText = sim.isManual ? "Boîte: MANUELLE" : "Boîte: AUTO";
            btn.classList.toggle('active', sim.isManual);
            document.getElementById('manual-shifter').style.display = sim.isManual ? 'flex' : 'none';
            document.getElementById('btn-clutch').style.display = sim.isManual ? 'flex' : 'none';
            sim.stalled = false;
        }

        function shiftGear(dir) {
            if (!sim.isManual || sim.phase !== 'DRIVING') return;
            if (!input.clutch) {
                showWarning("Appuyez sur l'EMBRAYAGE (E / EMB) pour changer de vitesse !");
                return;
            }
            sim.gear = Math.max(-1, Math.min(6, sim.gear + dir));
            if (sim.stalled && sim.gear === 0) sim.stalled = false;
        }

        function toggleRamps() {
            if (Math.abs(sim.speed) > 0.2) {
                showWarning("Arrêtez le camion avant d'actionner les rampes !");
                return;
            }
            sim.rampsDown = !sim.rampsDown;
        }

        function cycleCamera() {
            sim.camMode = (sim.camMode + 1) % 3;
        }

        let warnTimeout;
        function showWarning(msg) {
            const el = document.getElementById('warning-banner');
            el.innerText = "⚠️ " + msg;
            el.style.display = 'block';
            clearTimeout(warnTimeout);
            warnTimeout = setTimeout(() => el.style.display = 'none', 2500);
        }

        function resetGame() {
            sim.phase = 'LOADING';
            sim.rampsDown = false;
            sim.rampAngle = -1.35;
            sim.exX = -2; sim.exZ = -48; sim.exY = 0; sim.exAngle = 0; sim.exSpeed = 0;
            sim.x = -2; sim.z = -26; sim.tractorAngle = 0; sim.trailerAngle = 0;
            sim.speed = 0; sim.steerAngle = 0; sim.gear = 0; sim.rpm = 800; sim.stalled = false;
            document.getElementById('modal').style.display = 'none';
            document.getElementById('vehicle-mode').innerText = "ENGIN (Pelleteuse)";
            document.getElementById('mission-text').innerText = "1. Abaissez les rampes (B) et montez la pelleteuse sur le porte-char.";
        }

        const wheelBase = 4.2;
        const hitchOffset = -1.5;
        const trailerLength = 9.8;

        function update(dt) {
            const targetRamp = sim.rampsDown ? 0.28 : -1.35;
            sim.rampAngle += (targetRamp - sim.rampAngle) * 5 * dt;
            rampPivot.rotation.x = sim.rampAngle;

            if (sim.phase === 'LOADING') {
                if (input.gas) sim.exSpeed = 3.2;
                else if (input.brake) sim.exSpeed = -2.5;
                else sim.exSpeed *= 0.8;

                if (input.left) sim.exAngle += 1.2 * dt;
                if (input.right) sim.exAngle -= 1.2 * dt;

                sim.exX += Math.sin(sim.exAngle) * sim.exSpeed * dt;
                sim.exZ += Math.cos(sim.exAngle) * sim.exSpeed * dt;

                const hitchZ = sim.z + hitchOffset;
                const rampStartZ = hitchZ - 14.8;
                const bedStartZ = hitchZ - 12.2;
                const bedEndZ = hitchZ - 4.0;

                if (Math.abs(sim.exX - sim.x) < 1.3 && sim.exZ > rampStartZ && sim.exZ < bedEndZ) {
                    if (!sim.rampsDown && sim.exZ < bedStartZ) {
                        sim.exZ = rampStartZ;
                        showWarning("Abaissez les rampes avec le bouton RAMPES (B) !");
                    } else if (sim.exZ <= bedStartZ) {
                        const progress = (sim.exZ - rampStartZ) / (bedStartZ - rampStartZ);
                        sim.exY = Math.max(0, progress * 0.9);
                    } else {
                        sim.exY = 0.9;
                    }
                } else {
                    sim.exY = 0;
                }

                excavator.position.set(sim.exX, sim.exY, sim.exZ);
                excavator.rotation.y = sim.exAngle;

                document.getElementById('speed').innerText = `${Math.abs(Math.round(sim.exSpeed * 3.6))} km/h`;
                document.getElementById('gear-display').innerText = "CHENILLES";

                if (sim.exY >= 0.88 && sim.exZ > hitchZ - 9.5 && sim.exZ < hitchZ - 5.5 && Math.abs(sim.exSpeed) < 0.2) {
                    sim.phase = 'DRIVING';
                    sim.rampsDown = false;
                    document.getElementById('vehicle-mode').innerText = "CAMION PORTE-CHAR";
                    document.getElementById('mission-text').innerText = "2. Rejoignez la route à droite et garez le porte-char dans la zone verte au Nord !";
                    showWarning("Engin arrimé ! Rampes relevées. Démarrez le poids lourd !");
                }
            } else {
                const maxSteer = 0.55;
                if (input.left) sim.steerAngle = Math.min(maxSteer, sim.steerAngle + 1.4 * dt);
                else if (input.right) sim.steerAngle = Math.max(-maxSteer, sim.steerAngle - 1.4 * dt);
                else if (Math.abs(sim.speed) > 0.2) sim.steerAngle *= 0.92;

                if (!sim.isManual) {
                    if (input.gas) {
                        if (sim.speed < -0.2) sim.speed += 16 * dt;
                        else {
                            sim.speed = Math.min(18, sim.speed + 7.5 * dt);
                            sim.gear = Math.min(6, Math.max(1, Math.ceil(sim.speed / 3)));
                        }
                    } else if (input.brake) {
                        if (sim.speed > 0.2) sim.speed -= 18 * dt;
                        else {
                            sim.speed = Math.max(-6, sim.speed - 5 * dt);
                            sim.gear = -1;
                        }
                    } else {
                        sim.speed *= 0.97;
                        if (Math.abs(sim.speed) < 0.05) { sim.speed = 0; sim.gear = 0; }
                    }
                    sim.rpm = 800 + (Math.abs(sim.speed) % 3.2) * 550;
                } else {
                    if (sim.stalled) {
                        sim.rpm = 0;
                        sim.speed *= 0.92;
                        showWarning("MOTEUR CALÉ ! Passez au point mort (N) avec embrayage pour redémarrer.");
                    } else if (sim.gear === 0 || input.clutch) {
                        const targetRpm = input.gas ? 2600 : 800;
                        sim.rpm += (targetRpm - sim.rpm) * 6 * dt;
                        sim.speed *= 0.985;
                    } else {
                        const ratio = gearRatios[sim.gear];
                        const wheelRpm = Math.abs(sim.speed) * Math.abs(ratio) * 110;
                        sim.rpm = Math.max(600, wheelRpm);

                        if (sim.rpm < 720 && Math.abs(sim.gear) > 1 && !input.gas) {
                            sim.stalled = true;
                        }

                        if (input.gas && sim.rpm < 2800) {
                            const dir = sim.gear > 0 ? 1 : -1;
                            const torque = (12 / Math.abs(ratio)) * 1.6;
                            sim.speed += dir * torque * dt;
                        }
                    }

                    if (input.brake) {
                        sim.speed *= 0.90;
                        if (Math.abs(sim.speed) < 0.1) sim.speed = 0;
                    } else {
                        sim.speed *= 0.992;
                    }
                }

                if (Math.abs(sim.speed) > 0.02) {
                    const angularVel = (sim.speed / wheelBase) * Math.tan(sim.steerAngle);
                    sim.tractorAngle += angularVel * dt;
                    sim.x += Math.sin(sim.tractorAngle) * sim.speed * dt;
                    sim.z += Math.cos(sim.tractorAngle) * sim.speed * dt;
                }

                const hitchX = sim.x + Math.sin(sim.tractorAngle) * hitchOffset;
                const hitchZ = sim.z + Math.cos(sim.tractorAngle) * hitchOffset;
                const diffAngle = sim.tractorAngle - sim.trailerAngle;
                sim.trailerAngle += ((sim.speed / trailerLength) * Math.sin(diffAngle)) * dt;

                const cargoX = hitchX - Math.sin(sim.trailerAngle) * 7.2;
                const cargoZ = hitchZ - Math.cos(sim.trailerAngle) * 7.2;
                excavator.position.set(cargoX, 0.9, cargoZ);
                excavator.rotation.y = sim.trailerAngle;

                document.getElementById('speed').innerText = `${Math.abs(Math.round(sim.speed * 3.6))} km/h`;
                document.getElementById('gear-display').innerText = sim.gear === 0 ? 'N' : (sim.gear === -1 ? 'R' : 'D' + sim.gear);
                document.getElementById('rpm-val').innerText = `${Math.round(sim.rpm)} tr/m`;
                
                const rpmPct = Math.min(100, (sim.rpm / 2800) * 100);
                const rpmBar = document.getElementById('rpm-bar');
                rpmBar.style.width = rpmPct + '%';
                rpmBar.style.background = sim.rpm > 2300 ? '#ef4444' : '#10b981';

                const jackknife = Math.round(Math.atan2(Math.sin(diffAngle), Math.cos(diffAngle)) * 180 / Math.PI);
                document.getElementById('angle').innerText = `${jackknife}°`;
                if (Math.abs(jackknife) > 65) showWarning("ATTENTION MISE EN PORTEFEUILLE !");

                const distGoal = Math.hypot(cargoX - (-2), cargoZ - 85);
                if (distGoal < 3.0 && Math.abs(sim.speed) < 0.15) {
                    document.getElementById('modal-desc').innerText = "Vous avez chargé l'engin, géré le trafic et livré le porte-char à bon port !";
                    document.getElementById('modal').style.display = 'block';
                }
            }

            tractor.position.set(sim.x, 0, sim.z);
            tractor.rotation.y = sim.tractorAngle;
            wheelFL.rotation.y = sim.steerAngle;
            wheelFR.rotation.y = sim.steerAngle;

            const hX = sim.x + Math.sin(sim.tractorAngle) * hitchOffset;
            const hZ = sim.z + Math.cos(sim.tractorAngle) * hitchOffset;
            trailer.position.set(hX, 0, hZ);
            trailer.rotation.y = sim.trailerAngle;

            trafficCars.forEach(car => {
                const distToTruck = Math.hypot(car.mesh.position.x - sim.x, car.mesh.position.z - sim.z);
                const forwardBlocked = distToTruck < 16 && ((car.dir > 0 && sim.z > car.mesh.position.z) || (car.dir < 0 && sim.z < car.mesh.position.z));

                const targetSpd = forwardBlocked ? 0 : car.baseSpeed;
                car.speed += (targetSpd - car.speed) * 4 * dt;
                car.mesh.position.z += car.dir * car.speed * dt;

                if (car.dir > 0 && car.mesh.position.z > 180) car.mesh.position.z = -180;
                if (car.dir < 0 && car.mesh.position.z < -180) car.mesh.position.z = 180;
            });
        }

        function updateCamera() {
            if (sim.phase === 'LOADING') {
                camera.position.lerp(new THREE.Vector3(sim.exX - 7, 5.5, sim.exZ - 8), 0.1);
                camera.lookAt(sim.exX, 1.2, sim.exZ + 3);
                return;
            }

            if (sim.camMode === 0) {
                const cx = sim.x - Math.sin(sim.tractorAngle) * 17;
                const cz = sim.z - Math.cos(sim.tractorAngle) * 17;
                camera.position.lerp(new THREE.Vector3(cx, 7.5, cz), 0.12);
                camera.lookAt(sim.x, 2, sim.z);
            } else if (sim.camMode === 1) {
                const mx = sim.x - Math.cos(sim.tractorAngle) * 1.9 + Math.sin(sim.tractorAngle) * 1.5;
                const mz = sim.z + Math.sin(sim.tractorAngle) * 1.9 + Math.cos(sim.tractorAngle) * 1.5;
                camera.position.set(mx, 2.8, mz);
                const lx = trailer.position.x - Math.sin(sim.trailerAngle) * 12;
                const lz = trailer.position.z - Math.cos(sim.trailerAngle) * 12;
                camera.lookAt(lx, 1.0, lz);
            } else {
                camera.position.set(sim.x, 30, sim.z - 6);
                camera.lookAt(sim.x, 0, sim.z);
            }
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            update(dt);
            updateCamera();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log("Service Worker enregistré avec succès !"))
                    .catch((err) => console.log("Erreur d'enregistrement du Service Worker :", err));
            });
        }
    </script>
</body>
